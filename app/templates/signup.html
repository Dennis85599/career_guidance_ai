{% extends "base.html" %}
{% block content %}

<style>
.auth-card{
    border-radius:18px;
    background:white;
}

.form-control{
    padding:12px 14px;
    border-radius:12px;
}

.form-control:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 .15rem rgba(99,102,241,.25);
}

.step-indicator{
    background:#eef2ff;
    color:#4f46e5;
    padding:6px 18px;
    border-radius:50px;
    font-size:14px;
    font-weight:500;
}

.password-hint{
    font-size:13px;
}

.security-note{
    font-size:13px;
    color:#6b7280;
}
</style>

<div class="row justify-content-center animate__animated animate__fadeIn">
    <div class="col-xl-5 col-lg-6 col-md-8">

        <div class="card auth-card p-4 p-md-5 shadow-sm">

            <!-- HEADER -->
            <div class="text-center mb-4">
                <span class="step-indicator">Step 1 of 4</span>
                <h3 class="mt-3 fw-semibold">Create Student Account</h3>
                <p class="text-muted mb-0">
                    Start your personalized AI-powered career journey
                </p>
            </div>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <!-- FORM -->
            <form method="POST" action="{{ url_for('main.signup') }}">

                <!-- FULL NAME -->
                <div class="mb-3">
                    <label class="form-label fw-medium">Full Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="e.g. John Mwangi"
                        required
                        autofocus
                    >
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label fw-medium">Email Address</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a strong password"
                        minlength="8"
                        required
                        oninput="checkStrength(this.value)"
                    >
                    <small id="pwdHint" class="password-hint text-muted">
                        Minimum 8 characters
                    </small>
                </div>

                <!-- SECURITY NOTE -->
                <div class="security-note mb-4">
                    <i class="fa fa-lock me-1"></i>
                    Your information is encrypted and securely stored.
                </div>

                <!-- ACTION -->
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('main.login') }}" class="text-decoration-none">
                        Already have an account?
                    </a>

                    <button type="submit" class="btn btn-main px-4">
                        Continue
                        <i class="fa fa-arrow-right ms-2"></i>
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script>
function checkStrength(val){
    const hint = document.getElementById("pwdHint");
    if(val.length < 8){
        hint.innerText = "Too short – minimum 8 characters";
        hint.className = "password-hint text-danger";
    }else if(!(/[A-Z]/.test(val) && /[0-9]/.test(val))){
        hint.innerText = "Better: add a number and uppercase letter";
        hint.className = "password-hint text-warning";
    }else{
        hint.innerText = "Strong password ✔";
        hint.className = "password-hint text-success";
    }
}
</script>

{% endblock %}
