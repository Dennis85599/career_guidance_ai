{% extends "base.html" %}
{% block content %}

<style>
.auth-card{
    border-radius:18px;
    background:white;
}

.form-control{
    padding:12px 14px;
    border-radius:12px;
}

.form-control:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 .15rem rgba(99,102,241,.25);
}

.step-indicator{
    background:#eef2ff;
    color:#4f46e5;
    padding:6px 18px;
    border-radius:50px;
    font-size:14px;
    font-weight:500;
}
</style>

<div class="row justify-content-center animate__animated animate__fadeIn">
    <div class="col-xl-5 col-lg-6 col-md-8">

        <div class="card auth-card p-4 p-md-5 shadow-sm">

            <!-- HEADER -->
            <div class="text-center mb-4">
                <span class="step-indicator">Step 2 of 4</span>
                <h3 class="mt-3 fw-semibold">Welcome Back</h3>
                <p class="text-muted mb-0">
                    Log in to continue your AI career assessment
                </p>
            </div>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <!-- FORM -->
            <form method="POST" action="{{ url_for('main.login') }}">

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label fw-medium">Email Address</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="example@email.com"
                        required
                        autofocus
                    >
                </div>

                <!-- PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <!-- ACTIONS -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{{ url_for('main.signup') }}" class="text-decoration-none">
                        Create an account
                    </a>

                    <button type="submit" class="btn btn-main px-4">
                        Continue
                        <i class="fa fa-arrow-right ms-2"></i>
                    </button>
                </div>

                <!-- SECURITY NOTE -->
                <div class="text-center mt-4 text-muted" style="font-size:13px;">
                    <i class="fa fa-lock me-1"></i>
                    Secure login protected with encryption
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
