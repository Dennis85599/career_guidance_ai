{% extends "base.html" %}
{% block content %}

<style>
    .auth-card {
        border-radius: 16px;
        background: white;
    }

    .form-control {
        padding: 12px 14px;
        border-radius: 10px;
    }

    .step-indicator {
        background: #fee2e2;
        color: #991b1b;
        padding: 6px 18px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 500;
    }

    .error-text {
        color: #dc2626;
        font-size: 14px;
    }
</style>

<div class="row justify-content-center animate__animated animate__fadeIn">
    <div class="col-lg-6 col-md-8">

        <div class="card auth-card p-4 p-md-5 shadow-sm">

            <!-- HEADER -->
            <div class="text-center mb-4">
                <span class="step-indicator">Admin Access</span>
                <h3 class="mt-3 fw-semibold">Administrator Login</h3>
                <p class="text-muted">
                    Sign in to manage students and system data
                </p>
            </div>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <!-- FORM -->
            <form method="POST" action="{{ url_for('admin_login') }}">

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label fw-medium">Admin Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="admin@email.com"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter admin password"
                        required
                    >
                </div>

                <!-- ACTIONS -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{{ url_for('home') }}" class="text-decoration-none">
                        ← Back to Home
                    </a>

                    <button type="submit" class="btn btn-danger px-4">
                        Login
                        <i class="fa fa-lock ms-2"></i>
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
