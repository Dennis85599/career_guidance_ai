<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Career Guidance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --dark: #0f172a;
            --muted: #64748b;
            --bg: #f6f8fc;
            --card: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #eef2ff 0%, var(--bg) 45%);
            min-height: 100vh;
            padding-top: 80px;
            color: #1f2937;
        }

        /* NAVBAR */
        .navbar {
            backdrop-filter: blur(12px);
            background: rgba(15, 23, 42, 0.9);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: .3px;
        }

        .navbar .nav-link {
            font-size: 14px;
            opacity: .9;
        }

        .navbar .nav-link:hover {
            opacity: 1;
        }

        /* BUTTONS */
        .btn-main {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border: none;
            padding: 10px 26px;
            border-radius: 999px;
            color: white;
            font-weight: 500;
        }

        .btn-main:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(79,70,229,.25);
        }

        /* CARDS */
        .card {
            border: none;
            border-radius: 18px;
            background: var(--card);
        }

        /* MAIN CONTENT */
        main {
            min-height: calc(100vh - 220px);
        }

        /* FOOTER */
        footer {
            background: linear-gradient(180deg, #0f172a, #020617);
            color: #cbd5f5;
        }

        footer p {
            margin: 0;
            font-size: 13px;
        }

        footer a {
            color: #cbd5f5;
            text-decoration: none;
        }

        footer a:hover {
            color: white;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }

            .navbar-brand {
                font-size: 15px;
            }

            .btn-main {
                padding: 8px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('main.home') }}">
            <i class="fa-solid fa-brain me-1 text-primary"></i>
            AI Career Guidance
        </a>

        <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 mt-3 mt-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.help') }}">
                        <i class="fa fa-circle-question me-1"></i> Help
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.login') }}">
                        <i class="fa fa-sign-in-alt me-1"></i> Sign In
                    </a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-outline-light rounded-pill px-4 mt-2 mt-lg-0"
                       href="{{ url_for('main.signup') }}">
                        Sign Up
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<main class="container py-4 py-lg-5">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="pt-4 pb-4 mt-5">
    <div class="container text-center">
        <p>© 2026 AI Career Guidance System</p>
        <p class="opacity-75">
            Smart career recommendations powered by AI & data science
        </p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
